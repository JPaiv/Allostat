apiVersion: apps/v1
kind: Deployment
metadata:
  name: allostat-coordinator
  namespace: allostat-system
  labels:
    app.kubernetes.io/name: allostat
    app.kubernetes.io/component: coordinator
spec:
  # Two processes, one decides. The other takes over when the first is
  # gone. While neither decides, requests wait and nothing new starts.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: allostat
      app.kubernetes.io/component: coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: allostat
        app.kubernetes.io/component: coordinator
    spec:
      serviceAccountName: allostat-coordinator
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coordinator
          image: ghcr.io/jpaiv/allostat:dev
          args:
            - --leader-elect=true
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
