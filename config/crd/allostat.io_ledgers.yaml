---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: ledgers.allostat.io
spec:
  group: allostat.io
  names:
    kind: Ledger
    listKind: LedgerList
    plural: ledgers
    singular: ledger
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Ledger is the coordinator's list of the grants it gave in a namespace.

          Every grant is written here first, with a check that nobody else wrote
          since the ledger was read. Two coordinators can therefore never both give
          a grant from the same state. Only the coordinator writes it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          status:
            description: LedgerStatus holds the grants.
            properties:
              grants:
                description: Grants lists the grants that are not known to be closed.
                items:
                  description: LedgerGrant is one grant in the ledger.
                  properties:
                    deadline:
                      format: date-time
                      type: string
                    grantedAt:
                      format: date-time
                      type: string
                    record:
                      description: Record is the name of the DecisionRecord the grant
                        was made from.
                      type: string
                    request:
                      description: Request is the name of the action request that
                        holds the grant.
                      type: string
                    uid:
                      description: |-
                        UID is the UID of that request. A new request with the same name
                        does not inherit the grant.
                      type: string
                  required:
                  - deadline
                  - grantedAt
                  - request
                  - uid
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - request
                x-kubernetes-list-type: map
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
