name: Proposal
description: A new feature or a change to how contracts or decisions work
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, or what goes wrong? Give a concrete case.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Effect on safety
      description: >-
        Can this change turn a refusal into a grant? What happens when
        evidence is missing or old, or when the coordinator is down?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to solve it, including a simple fixed rule.
